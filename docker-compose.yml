version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - GENX_ROOT=/data/genx
      - JWT_SECRET=${JWT_SECRET:-change-me}
      - DATABASE_URL=sqlite:////data/genx.db
      - ALLOWED_ORIGINS=http://localhost:3000
    volumes:
      - ./backend:/app
      - ${GENX_ROOT:-./data}:/data/genx:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev